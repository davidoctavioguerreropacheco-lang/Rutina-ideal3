<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1115">
  <!-- Que Google no muestre esta página en búsquedas (el link no se comparte) -->
  <meta name="robots" content="noindex, nofollow">
  <title>Tracker de Entrenamiento</title>
  <!-- Para "Agregar a pantalla de inicio" -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icono-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <!-- ?v=1: cuando cambiemos el código se sube este número para que el celular no use una copia vieja -->
  <link rel="stylesheet" href="css/estilos.css?v=1">
</head>
<body>
  <main id="pantalla"></main>

  <nav class="nav" aria-label="Navegación">
    <button type="button" data-ir="hoy"><span class="ico" aria-hidden="true">🏠</span>Hoy</button>
    <button type="button" data-ir="comparar"><span class="ico" aria-hidden="true">⇄</span>Comparar</button>
    <button type="button" data-ir="historial"><span class="ico" aria-hidden="true">📋</span>Historial</button>
    <button type="button" data-ir="ajustes"><span class="ico" aria-hidden="true">⚙</span>Ajustes</button>
  </nav>

  <!-- Librería oficial de Supabase (versión fija) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <!-- Nuestros archivos, en este orden -->
  <script src="js/config.js?v=1"></script>
  <script src="js/rutina.js?v=1"></script>
  <script src="js/progresion.js?v=1"></script>
  <script src="js/db.js?v=1"></script>
  <script src="js/pantallas.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
</body>
</html>
